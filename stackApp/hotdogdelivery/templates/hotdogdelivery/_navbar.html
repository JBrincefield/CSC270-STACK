{% load static %}
<!-- Primary navigation fragment -->
<nav class="hotdog-nav" aria-label="Primary navigation">
	<img src="{% static 'hotdogdelivery/hotdog.png' %}" alt="" aria-hidden="true" class="nav-art">
	<div class="nav-links">
		<a href="{% url 'home' %}">Home</a>
		<a href="{% url 'order' %}">Order</a>
		<a href="{% url 'mission' %}">Mission</a>
		{% if current_user %}
			<span class="nav-user" title="{{ current_user.email }}">{{ current_user.name|truncatechars:18 }}</span>
			{% if current_user.is_admin %}<span class="nav-admin-badge">Admin</span>{% endif %}
			<a href="#" class="nav-logout" onclick="signOutUser(); return false;">🚪 Log Out</a>
		{% else %}
			<a href="{% url 'login' %}?next={{ request.path }}" class="nav-signin">Sign In</a>
		{% endif %}
	</div>
</nav>
